<!DOCTYPE html >
<html lang = "en" >
<head >
    <meta charset = "UTF-8" >
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0" >
    <title > {% block title %}Photoshare{% endblock %} </title >
    <!-- Bootstrap CSS -->
    <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel = "stylesheet" >
    <!-- Font Awesome -->
    <link href = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel = "stylesheet" >
    <style >
        body {background-color:  #f4f6f9; }
        .navbar {background-color:  #75b2f2; padding: 10px; }
        .navbar-brand img {width: 120px;}
        .dropdown-menu {background-color:  #75b2f2; border: none; }
        .dropdown-item {color: white;}
        .dropdown-item:hover {background-color:  #53a366; }
        .photo-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            height: 100% ;
        }
        .photo-card img {
            width: 100% ;
            height:200px;
            object-fit: cover;
            border-radius: 10px 10px 0 0;
        }
        .card-body {
            padding: 15px;
            flex-grow: 1;
        }
        .card-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .card-text {
            font-size: 0.9rem;
            color:  #555;
        }
        .upload-button {
        background: linear - gradient(45deg,  #53a366, #75b2f2);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 16px;
        text-decoration: none;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
    }

    .upload-button:hover {
        background-color:  #218838; /
    }

    .dashboard-button {
        background: linear - gradient(45deg,  #53a366, #75b2f2);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 16px;
        text-decoration: none;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
    }

    .dashboard-button:hover {
        background:linear-gradient(45deg,  #218838, #53a366);
        box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        transform: translateY(-2px);
    }

    .menu-button {
        background: linear-gradient(45deg, #75b2f2, #53a366);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 16px;
        text-decoration: none;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
    }

    .menu-button:hover {
        background: linear-gradient(45deg, #53a366, #75b2f2);
        box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        transform: translateY(-2px);
    }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class = "navbar navbar-expand-lg navbar-light" >
        <div class="container">

            <div class="d-flex align-items-center">
                <a class="navbar-brand me-3" href="/">
                    <img src="/static/logo.png" alt="Photoshare Logo">
                </a>
                <a href="/app/other/dashboard" class="btn dashboard-button">Dashboard</a>
            </div>


            <div class="navbar-nav ms-auto">
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle btn menu-button" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-bars me-2"></i> Menu
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="/app/auth/register">Register</a></li>
                        <li><a class="dropdown-item" href="/app/auth/login">LogIn</a></li>
                        <li><a class="dropdown-item" href="/">LogOut</a></li>
                        <li><a class="dropdown-item" href="/app/other/dashboard">Dashboard</a></li>
                        <li><a class="dropdown-item" href="/app/other/contacts">Contacts</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="container text-center mt-5 py-3">
        <p>&copy; 2025 Photoshare. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
