{% extends "base.html" %}

{% block title %}Contacts - Photoshare{% endblock %}

{% block content %}
<h2 class="my-4">Contact Us</h2>

<div class="row">
    <div class="col-md-6">
        <h4>Our Office</h4>
        <p><strong>Address:</strong> 123 Photoshare Avenue, Cityville</p>
        <p><strong>Email:</strong> support@photoshare.com</p>
        <p><strong>Phone:</strong> +1 234 567 890</p>
    </div>

    <div class="col-md-6">
        <h4>Contact Form</h4>
        <form action="#" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn menu-button">Submit</button>
        </form>
    </div>
</div>

{% endblock %}
