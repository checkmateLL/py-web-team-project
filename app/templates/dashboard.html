{% extends "base.html" %}

{% block title %}Dashboard - Photoshare{% endblock %}

{% block content %}
<h2 class="my-4">Dashboard</h2>

<!-- Upload New Photo -->
<div class="mb-4">
    <h4>Upload a New Photo</h4>
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="photo" class="form-label">Choose a file</label>
            <input type="file" class="form-control" id="photo" name="photo" required>
        </div>
        <button type="submit" class="btn dashboard-button">Upload</button>
    </form>
</div>

<!-- Your Photos -->
<div class="row">
    <div class="col-md-12">
        <h4>Your Photos</h4>
        <div class="row">
            <!-- Example of a photo card, you will loop through your photos here -->
            <div class="col-md-4 mb-4">
                <div class="photo-card">
                    <img src="#" alt="Photo 1">
                    <div class="card-body">
                        <h5 class="card-title">Photo 1</h5>
                        <p class="card-text">Uploaded: 12/12/2025</p>
                        <button class="btn btn-danger" onclick="deletePhoto(1)">Delete</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="photo-card">
                    <img src="#" alt="Photo 2">
                    <div class="card-body">
                        <h5 class="card-title">Photo 2</h5>
                        <p class="card-text">Uploaded: 10/12/2025</p>
                        <button class="btn btn-danger" onclick="deletePhoto(2)">Delete</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="photo-card">
                    <img src="#" alt="Photo 2">
                    <div class="card-body">
                        <h5 class="card-title">Photo 2</h5>
                        <p class="card-text">Uploaded: 10/12/2025</p>
                        <button class="btn btn-danger" onclick="deletePhoto(2)">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
